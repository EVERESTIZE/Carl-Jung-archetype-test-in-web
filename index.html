<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCHETYPE : 무의식의 타로 아카이브</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    @font-face {
      font-family: 'choiceFont';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.3/NeoDunggeunmo.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'choiceFont', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #06070a;
      color: #e2e8f0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
    }

    /* 배경 은은한 신비로운 글로우 */
    body::before {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.04) 0%, rgba(56, 189, 248, 0.03) 40%, transparent 70%);
      z-index: -1;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 480px;
      position: relative;
    }

    .board {
      background: #0c0f17;
      border: 1px solid #1e2638;
      border-radius: 20px;
      padding: 24px 18px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(212, 175, 55, 0.15);
      position: relative;
      overflow: hidden;
    }

    .tarot-arch {
      width: 44px;
      height: 44px;
      border: 1px solid #d4af37;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      color: #d4af37;
      font-size: 1.1rem;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.25);
    }

    /* 1. 인트로 화면 */
    .intro-scene {
      text-align: center;
      animation: fadeIn 0.4s ease;
    }
    .intro-tag {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 2px;
      color: #d4af37;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .intro-title {
      font-size: 1.55rem;
      font-weight: 800;
      line-height: 1.4;
      color: #f8fafc;
      margin-bottom: 16px;
      word-break: keep-all;
    }
    .intro-tarot-box {
      background: #07090f;
      border: 1px dashed #283347;
      border-radius: 12px;
      padding: 18px 16px;
      margin-bottom: 20px;
      text-align: left;
      font-size: 0.88rem;
      line-height: 1.7;
      color: #94a3b8;
      word-break: keep-all;
    }
    .intro-tarot-box strong {
      color: #d4af37;
    }
    .intro-info {
      display: flex;
      justify-content: center;
      gap: 14px;
      font-size: 0.78rem;
      color: #64748b;
      margin-bottom: 20px;
    }

    /* 2. 타로 테스트 진행 씬 */
    #quiz-scene {
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.75rem;
      color: #94a3b8;
      letter-spacing: 1px;
    }
    .status-bar .counter {
      color: #d4af37;
    }
    .progress-line {
      height: 4px;
      background: #192233;
      border-radius: 2px;
      margin-bottom: 18px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #d4af37, #38bdf8);
      transition: width 0.3s ease;
    }
    .question-prompt {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.5;
      color: #ffffff;
      margin-bottom: 8px;
      min-height: 52px;
      text-align: center;
      word-break: keep-all;
    }

    .fan-guide {
      text-align: center;
      font-size: 0.72rem;
      color: #64748b;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    /* --- 부채꼴(반호) 카드 배치 영역 --- */
    .card-fan-area {
      position: relative;
      width: 100%;
      height: 310px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      perspective: 1200px;
      padding-bottom: 15px;
    }

    /* --- 기존 .tarot-card 너비 및 높이 수정 --- */
.tarot-card {
  position: absolute;
  bottom: 15px;
  width: 108px;        /* 135px -> 108px로 슬림화해 겹침 최소화 */
  height: 180px;       /* 텍스트 줄바꿈 공간 확보 */
  background: radial-gradient(circle at 50% 30%, #171d2b, #080a10);
  border: 2px solid #d4af37;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8), 0 0 12px rgba(212, 175, 55, 0.25);
  padding: 14px 8px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  text-align: center;
  cursor: pointer;
  user-select: none;
  transform-origin: 50% 150%; /* 회전축을 더 아래로 내려 부채꼴을 완만하게 형성 */
  transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.35s ease, border-color 0.35s ease, opacity 0.3s ease;
}

    /* 금박 안쪽 이중 프레임 */
    .tarot-card::before {
      content: "";
      position: absolute;
      top: 4px; left: 4px; right: 4px; bottom: 4px;
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 8px;
      pointer-events: none;
    }

    .card-rune {
      font-size: 0.75rem;
      color: #d4af37;
      letter-spacing: 1px;
    }
    .card-text {
      font-size: 0.75rem;
      line-height: 1.42;
      color: #f1f5f9;
      word-break: keep-all;
      z-index: 1;
      padding: 0 2px;
    }
    .card-seal {
      font-size: 0.72rem;
      color: #d4af37;
    }

    /* 4장 반호형 부채꼴 배치 */
    .tarot-card:nth-child(1) {
      transform: translateX(-110px) translateY(-20px) rotate(-16deg);
      z-index: 1;
    }
    .tarot-card:nth-child(2) {
      transform: translateX(-37px) translateY(-30px) rotate(-5deg);
      z-index: 2;
    }
    .tarot-card:nth-child(3) {
      transform: translateX(37px) translateY(-30px) rotate(5deg);
      z-index: 3;
    }
    .tarot-card:nth-child(4) {
      transform: translateX(110px) translateY(-20px) rotate(16deg);
      z-index: 4;
    }

    

    /* 뽑힌 카드 연출: 중앙으로 솟구치며 나머지 카드들과 확실히 분리 */
.tarot-card.is-picked {
  transform: translateY(-70px) rotate(0deg) scale(1.18) !important;
  border-color: #ffffff !important;
  z-index: 30 !important;
  transition: transform 0.35s ease;
}

    /* 3. 영수증/티켓형 아카이브 결과 씬 */
    .ticket {
      background: #080a10;
      border: 1px dashed #334155;
      border-radius: 14px;
      padding: 22px 16px;
      text-align: center;
      position: relative;
      animation: fadeIn 0.4s ease;
    }
    .ticket-header {
      font-size: 0.72rem;
      letter-spacing: 3px;
      color: #d4af37;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .ticket-badge {
      display: inline-block;
      background: rgba(212, 175, 55, 0.12);
      color: #fef08a;
      border: 1px solid rgba(212, 175, 55, 0.35);
      font-size: 0.78rem;
      padding: 4px 12px;
      border-radius: 16px;
      margin-bottom: 12px;
    }
    .ticket-title {
      font-size: 1.55rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 14px;
      word-break: keep-all;
    }
    .ticket-divider {
      height: 1px;
      border-bottom: 1px dashed #1e293b;
      margin: 14px 0;
    }
    .ticket-desc {
      text-align: left;
      font-size: 0.86rem;
      line-height: 1.7;
      color: #94a3b8;
      white-space: pre-line;
      word-break: keep-all;
      background: #0d121c;
      border: 1px solid #1a2336;
      border-radius: 10px;
      padding: 16px;
    }
    .ticket-footer {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .barcode {
      letter-spacing: 5px;
      font-size: 1.1rem;
      color: #475569;
      user-select: none;
    }
    .serial-no {
      font-size: 0.68rem;
      color: #475569;
      letter-spacing: 1px;
    }

    .primary-btn {
      width: 100%;
      background: linear-gradient(135deg, #d4af37, #b48a1c);
      color: #0b0e14;
      border: none;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 800;
      padding: 14px 20px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 18px rgba(212, 175, 55, 0.3);
      margin-top: 16px;
    }
    .primary-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }
/* 12대 원형 도감 뷰어 컨테이너 */
.archive-viewer {
  display: none;
  animation: fadeIn 0.3s ease;
  text-align: center;
}

.viewer-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 14px;
  gap: 12px;
}

.nav-arrow-btn {
  background: #131926;
  border: 1px solid #d4af37;
  color: #d4af37;
  font-size: 1.1rem;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  user-select: none;
}
.nav-arrow-btn:hover {
  background: #d4af37;
  color: #080a10;
  box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
}

.viewer-counter {
  font-size: 0.85rem;
  color: #94a3b8;
  letter-spacing: 2px;
}

/* 보조 버튼 스타일 (도감 열기 / 내 결과로 복귀) */
.secondary-btn {
  width: 100%;
  background: transparent;
  color: #d4af37;
  border: 1px solid #d4af37;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 700;
  padding: 12px 18px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s ease;
  margin-top: 10px;
}
.secondary-btn:hover {
  background: rgba(212, 175, 55, 0.12);
  transform: translateY(-1px);
}

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="board" id="main-board">
      
      <!-- 1. 시작 화면 -->
      <div class="intro-scene" id="intro-view">
        <div class="tarot-arch">✦</div>
        <div class="intro-tag">Jungian Archetype Deck</div>
        <h1 class="intro-title">무의식이 숨겨둔<br>24장의 타로 아카이브</h1>
        <div class="intro-tarot-box">
          칼 구스타프 융은 모든 인간의 심연 속에 <strong>12가지 고유한 원형</strong>이 새겨져 있다고 보았습니다.<br><br>
          스쳐 지나가는 질문마다 직관이 이끄는 금박 카드를 뽑아 올리세요. 24번의 선택 끝에 당신의 무의식을 지배하는 <strong>단 하나의 봉인된 원형 카드</strong>가 해금됩니다.
        </div>
        <div class="intro-info">
          <span>덱 규모: 24 카드</span>
          <span>•</span>
          <span>소요 시간: 약 4분</span>
        </div>
        <button class="primary-btn" onclick="startDeck()">타로 덱 셔플 & 시작</button>
      </div>

      <!-- 2. 테스트 진행 화면 -->
      <div id="quiz-scene">
        <div class="status-bar">
          <span class="counter" id="deck-counter">CARD 01 / 24</span>
          <span>SELECT A CARD</span>
        </div>
        <div class="progress-line">
          <div class="progress-fill" id="progress-line"></div>
        </div>
        <div class="question-prompt" id="prompt-text">질문 내용이 표시됩니다.</div>
        <div class="fan-guide">▼ 직관이 닿는 카드를 선택해 위로 뽑아내세요 ▼</div>
        <div class="card-fan-area" id="cards-container"></div>
      </div>

    </div>
  </div>

  <script>
    const archetypes = {
      INNOCENT: {
        title: "순수주의자 (The Innocent)",
        badge: "Arcana 01 · 낙관과 신뢰의 영혼",

      },
      EVERYMAN: {
        title: "보통 사람 (The Everyman)",

      },
      HERO: {
        title: "영웅 (The Hero)",
        badge: "Arcana 03 · 결단과 승리의 영혼",

      },
      CAREGIVER: {
        title: "조력자 (The Caregiver)",
        badge: "Arcana 04 · 연민과 보호의 영혼",
        desc: "당신은 타인의 상처와 결핍을 지나치지 못하고 품어주는 대지의 수호자입니다. 주변 사람들에게 단단한 방패막과 피난처가 되어주는 데서 보람을 얻습니다.\n\n• 영혼의 키워드: 헌신, 이타심, 보살핌\n• 발현되는 권능: 세심한 관찰력, 무조건적인 온기, 치유력\n• 주의해야 할 그림자: 자신을 갉아먹는 희생으로 인한 번아웃"
      },
      EXPLORER: {
        title: "탐험가 (The Explorer)",
        badge: "Arcana 05 · 자유와 방랑의 영혼",
        desc: "당신은 획일화된 규격과 안락한 새장을 단호히 거부하고 미지의 지평선을 향해 닻을 올리는 모험가입니다. 스스로 길을 낼 때 진정한 자아를 발견합니다.\n\n• 영혼의 키워드: 자유, 자아 탐색, 개척\n• 발현되는 권능: 독립심, 두려움 없는 호기심, 유연성\n• 주의해야 할 그림자: 한곳에 머물지 못하는 만성적 공허와 방황"

      REBEL: {
        title: "반역자 (The Rebel)",
        badge: "Arcana 06 · 변혁과 해방의 영혼",

        desc: "당신은 사랑하는 대상과 영혼 깊은 교감을 나누며 오감을 다해 삶의 아름다움을 탐닉합니다. 가슴 뛰는 황홀경과 진정한 유대감이 당신의 연료입니다.\n\n• 영혼의 키워드: 친밀감, 감각적 몰입, 낭만\n• 발현되는 권능: 매혹, 풍부한 감수성, 깊은 공감 능력\n• 주의해야 할 그림자: 거절에 대한 극심한 공포, 감정적 과몰입"

      },
      JESTER: {

          { text: "친구들을 불러 모아 실컷 떠들며 맛있는 술과 음식으로 기분을 푼다.", type: "JESTER" },
          { text: "명상이나 사색을 통해 내면의 직관과 무의식이 보내는 신호를 읽는다.", type: "MAGICIAN" }
        ]
      },
      {
        question: "내가 속한 집단(학교, 직장 등)에서 내가 가장 견디기 힘든 부조리는?",
        choices: [
          { text: "지휘 체계가 엉망이고 규칙이 없어 모두가 갈팡질팡하는 무질서", type: "RULER" },
          { text: "서로를 불신하고 뒤에서 험담과 음모를 꾸미는 삭막한 공기", type: "INNOCENT" },
          { text: "객관적인 팩트나 근거 없이 편견과 헛소문만으로 의사결정을 내리는 것", type: "SAGE" },
          { text: "인간에 대한 따뜻한 애정 없이 서로를 부품이나 도구로만 취급하는 것", type: "LOVER" }
        ]
      },
      {
        question: "나에게 진정한 '성공'의 의미는 무엇인가요?",
        choices: [
          { text: "남들이 넘볼 수 없는 뛰어난 실력으로 당당하게 최고가 되는 것", type: "HERO" },
          { text: "세상을 바꾸는 패러다임을 제시하고 기적 같은 변화를 이끄는 것", type: "MAGICIAN" },
          { text: "평범하지만 좋은 이웃들과 함께 소박하고 평화롭게 어우러져 사는 것", type: "EVERYMAN" },
          { text: "어떤 풍파에도 때 묻지 않고 맑고 순수한 영혼을 지켜내는 것", type: "INNOCENT" }
        ]
      },
      {
        question: "복잡한 문제를 해결해야 할 때 내가 가장 먼저 의지하는 방식은?",
        choices: [
          { text: "관련 서적, 논문, 데이터 등 검증된 지식을 철저하게 수집한다.", type: "SAGE" },
          { text: "전체적인 직관과 통찰로 문제의 이면에 숨은 핵심 변수를 짚어낸다.", type: "MAGICIAN" },
          { text: "역할을 명확히 나누고 마감 기한과 절차를 정해 프로세스로 푼다.", type: "RULER" },
          { text: "직접 몸으로 부딪쳐 현장을 돌아다니며 단서를 찾아낸다.", type: "EXPLORER" }
        ]
      },
      {
        // 24번: 옵션 B 기반 (CAREGIVER, JESTER, LOVER, CREATOR)
        question: "온전한 나만의 공간(방/작업실)을 새롭게 꾸밀 때 가장 먼저 고려하는 것은?",
        choices: [
          { text: "언제든 소중한 사람이 찾아와 편히 쉬다 갈 수 있는 포근하고 안락한 구성", type: "CAREGIVER" },
          { text: "볼 때마다 피식 웃음이 나오는 위트 있는 피규어, 독특한 포스터와 소품", type: "JESTER" },
          { text: "은은한 조명, 아늑한 향초와 음악 등 오감을 만족시키는 감성적인 무드", type: "LOVER" },
          { text: "기성품 대신 내 손으로 직접 커스텀하거나 독창적인 개성이 돋보이는 오브제", type: "CREATOR" }
        ]
      }
    ];

    const scores = {
      INNOCENT: 0, EVERYMAN: 0, HERO: 0, CAREGIVER: 0,
      EXPLORER: 0, REBEL: 0, LOVER: 0, CREATOR: 0,
      JESTER: 0, SAGE: 0, MAGICIAN: 0, RULER: 0
    };

    let currentIndex = 0;
    const runes = ["I", "II", "III", "IV"];

    function startDeck() {
      document.getElementById('intro-view').style.display = 'none';
      document.getElementById('quiz-scene').style.display = 'block';
      renderCardQuestion();
    }

    function renderCardQuestion() {
      const q = questions[currentIndex];
      const cardNum = (currentIndex + 1).toString().padStart(2, '0');
      
      document.getElementById('deck-counter').innerText = `CARD ${cardNum} / 24`;
      document.getElementById('prompt-text').innerText = q.question;
      
      const percent = (currentIndex / questions.length) * 100;
      document.getElementById('progress-line').style.width = `${percent}%`;

      const cardsContainer = document.getElementById('cards-container');
      cardsContainer.innerHTML = '';

      q.choices.forEach((choice, idx) => {
        const card = document.createElement('div');
        card.className = 'tarot-card';
        card.innerHTML = `
          <div class="card-rune">✦ ${runes[idx]} ✦</div>
          <div class="card-text">${choice.text}</div>
          <div class="card-seal">❖</div>
        `;
        
        // 카드 클릭 시 위로 쑥 뽑혀 올라오는 연출 후 다음 문항 전환
        card.onclick = () => {
          cardsContainer.style.pointerEvents = 'none';
           // 선택되지 않은 다른 카드들을 흐리게 처리하여 선택한 카드 강조
          const allCards = cardsContainer.querySelectorAll('.tarot-card');
          allCards.forEach(c => {
            if (c !== card) c.style.opacity = '0.2';
          });

          card.classList.add('is-picked');
          
          // 0.8초(800ms) 동안 뽑힌 카드를 감상한 뒤 다음으로 이동
          setTimeout(() => {
            cardsContainer.style.pointerEvents = 'auto';
            selectTarot(choice.type);
          }, 800);
        };


        cardsContainer.appendChild(card);
      });
    }

    function selectTarot(type) {
      scores[type] += 1;
      currentIndex++;

      if (currentIndex < questions.length) {
        renderCardQuestion();
      } else {
        revealArchResult();
      }
    }
    let userResultType = ''; // 전역 변수 선언

    function revealArchResult() {
      document.getElementById('progress-line').style.width = '100%';

      // 1. 최고 점수 탐색
      let maxScore = -1;
      for (const type in scores) {
        if (scores[type] > maxScore) {
          maxScore = scores[type];
        }
      }

      // 2. 동점 발생 시 무작위 1인 공정 추첨
      const topTypes = [];
      for (const type in scores) {
        if (scores[type] === maxScore) {
          topTypes.push(type);
        }
      }
      userResultType = topTypes[Math.floor(Math.random() * topTypes.length)];
      const result = archetypes[userResultType];

      // 타로 아카이브 티켓 레이아웃 출력 (result-view로 감싸기)
      const board = document.getElementById('main-board');
      board.innerHTML = `
        <div id="result-view">
          <div class="ticket">
            <div class="ticket-header">Archival Certificate</div>
            <div class="ticket-badge">${result.badge}</div>
            <h2 class="ticket-title">${result.title}</h2>
            <div class="ticket-divider"></div>
            <div class="ticket-desc">${result.desc}</div>
            <div class="ticket-footer">
              <div class="barcode">||| | | |||| | ||| | ||</div>
              <div class="serial-no">UNCONSCIOUS SERIAL · ${Math.random().toString(36).substring(2, 9).toUpperCase()}</div>
            </div>
          </div>
          <button class="secondary-btn" onclick="saveAndShareTicket()">✦ 결과 티켓 이미지 저장 / 공유</button>
          <button class="secondary-btn" onclick="openArchiveViewer()">✦ 12대 원형 전체 도감 열람</button>
          <button class="primary-btn" onclick="location.reload()">새로운 타로 덱 뽑기</button>
        </div>

        <!-- 12대 원형 도감 넘김 뷰어 -->
        <div id="archive-view" class="archive-viewer">
          <div class="ticket" id="archive-card-box"></div>
          <div class="viewer-nav">
            <button class="nav-arrow-btn" onclick="slideArchive(-1)">◀</button>
            <span class="viewer-counter" id="archive-counter">01 / 12</span>
            <button class="nav-arrow-btn" onclick="slideArchive(1)">▶</button>
          </div>
          <button class="secondary-btn" onclick="closeArchiveViewer()">내 결과 티켓으로 돌아가기</button>
        </div>
      `;
    }

    const archetypeKeys = Object.keys(archetypes);
    let currentArchiveIdx = 0;

    function openArchiveViewer() {
      document.getElementById('result-view').style.display = 'none';
      document.getElementById('archive-view').style.display = 'block';
      // 사용자가 뽑은 결과 카드 번호부터 시작
      currentArchiveIdx = archetypeKeys.indexOf(userResultType);
      renderArchiveCard();
    }

    function closeArchiveViewer() {
      document.getElementById('archive-view').style.display = 'none';
      document.getElementById('result-view').style.display = 'block';
    }

    function slideArchive(direction) {
      currentArchiveIdx += direction;
      if (currentArchiveIdx < 0) currentArchiveIdx = archetypeKeys.length - 1;
      if (currentArchiveIdx >= archetypeKeys.length) currentArchiveIdx = 0;
      renderArchiveCard();
    }

    function renderArchiveCard() {
      const typeKey = archetypeKeys[currentArchiveIdx];
      const item = archetypes[typeKey];
      const cardNum = (currentArchiveIdx + 1).toString().padStart(2, '0');

      document.getElementById('archive-counter').innerText = `${cardNum} / 12`;
      document.getElementById('archive-card-box').innerHTML = `
        <div class="ticket-header">Arcana Archive Entry</div>
        <div class="ticket-badge">${item.badge}</div>
        <h2 class="ticket-title">${item.title}</h2>
        <div class="ticket-divider"></div>
        <div class="ticket-desc">${item.desc}</div>
      `;
    }
async function saveAndShareTicket() {
  const ticketElement = document.querySelector('.ticket');
  if (!ticketElement) return;

  try {
    const canvas = await html2canvas(ticketElement, {
      backgroundColor: null, // ★ 핵심 1: 배경 이중 덧칠로 어두워지는 현상 방지 (투명 베이스)
      scale: 2,              // 선명한 해상도
      useCORS: true,
      logging: false,
      // ★ 핵심 2: 복제본에서 fadeIn 애니메이션을 완전히 꺼서 100% 밝기 상태로 캡처
      onclone: (clonedDoc) => {
        const clonedTicket = clonedDoc.querySelector('.ticket');
        if (clonedTicket) {
          clonedTicket.style.animation = 'none';
          clonedTicket.style.transition = 'none';
          clonedTicket.style.opacity = '1';
          clonedTicket.style.filter = 'none';
        }
      }
    });

    canvas.toBlob(async (blob) => {
      if (!blob) return;

      const file = new File([blob], 'archetype-ticket.png', { type: 'image/png' });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            title: 'ARCHETYPE : 무의식의 타로 아카이브',
            text: '나의 무의식 심연 속 원형 타로 티켓을 확인해보세요.',
            files: [file]
          });
          return;
        } catch (err) {
          if (err.name !== 'AbortError') console.error(err);
        }
      }

      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'archetype-ticket.png';
      link.click();
      URL.revokeObjectURL(link.href);
    }, 'image/png');

  } catch (error) {
    alert('이미지 저장 중 오류가 발생했습니다.');
    console.error(error);
  }
}


  </script>
