<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>칼 융 12대 성격 원형 검사</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
@font-face {
  font-family: 'choiceFont';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.3/NeoDunggeunmo.woff') format('woff');
  font-weight: normal;
  font-style: normal;
}

    body {
      font-family: 'choiceFont', 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      min-height: 100vh;
      min-height: 100dvh; /* 모바일용 */
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 16px;
    }
    .card {
      background: #131c2e;
      border: 1px solid #1e293b;
      padding: 36px 26px;
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    }

    /* 시작 화면 스타일 */
    .intro-box {
      text-align: center;
      animation: fadeIn 0.4s ease;
    }
    .intro-badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .intro-title {
      font-size: 1.7rem;
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 18px;
      color: #f8fafc;
    }
    .intro-desc {
      font-size: 0.96rem;
      line-height: 1.75;
      color: #cbd5e1;
      margin-bottom: 28px;
      text-align: left;
      background: #090d16;
      border: 1px solid #1e293b;
      padding: 20px;
      border-radius: 12px;
    }
    .intro-meta {
      display: flex;
      justify-content: center;
      gap: 16px;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .intro-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 퀴즈 영역 스타일 (기본적으로 숨김 처리) */
    #quiz-content {
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .progress-bar {
      height: 6px;
      background: #1e293b;
      border-radius: 3px;
      margin-bottom: 24px;
      overflow: hidden;
    }
    .progress {
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      width: 0%;
      transition: width 0.3s ease;
    }
    .question-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #38bdf8;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .question-text {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 24px;
      min-height: 60px;
      white-space: pre-line;
    }
    .choices-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .choice-btn {
      font-family: 'choiceFont', 'Pretendard', sans-serif;
      width: 100%;
      text-align: left;
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      padding: 15px 18px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .choice-btn:hover {
      background: #27354f;
      border-color: #38bdf8;
      transform: translateY(-2px);
      color: #ffffff;
    }

    /* 결과 화면 스타일 */
    .result-box {
      text-align: center;
      animation: fadeIn 0.4s ease;
    }
    .result-badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .result-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 16px;
      color: #f8fafc;
    }
    .result-desc {
      font-size: 0.95rem;
      line-height: 1.7;
      color: #cbd5e1;
      margin-bottom: 24px;
      white-space: pre-line;
      background: #090d16;
      border: 1px solid #1e293b;
      padding: 20px;
      border-radius: 12px;
      text-align: left;
    }

    /* 시작 버튼 */
    .primary-btn {
      width: auto;
      min-width: 50%;
      margin: 0 auto;
      display: block;
      
      font-family: 'choiceFont', 'Pretendard', sans-serif;
      
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      color: #ffffff;
      border: none;
      font-weight: 700;
      padding: 15px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1.05rem;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
      transition: all 0.2s ease;
    }
    .primary-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card" id="quiz-container">
    <!-- 1. 첫 시작 안내 화면 -->
    <div class="intro-box" id="intro-content">
      <div class="intro-badge">Jungian Archetypes Test</div>
      <h1 class="intro-title">무의식에 지배되는 나,<br>칼 융의 12대 원형 검사</h1>
      <div class="intro-desc">
        스위스의 심리학자 <strong>칼 구스타프 융(Carl Jung)</strong>은 인류에게 공유되는 무의식의 원초적 이미지와 행동 패턴을 <strong>'원형(Archetype)'</strong>이라 불렀습니다.<br><br>
        본 검사는 12가지 대표 원형 중 나의 사고와 선택을 이끄는 <strong>핵심 동기, 고유한 강점</strong>과 경계해야 할 <strong>무의식 속 그림자</strong>를 진단합니다.
      </div>
      <div class="intro-meta">
        <span>⏱ 소요 시간 약 6분</span>
        <span>•</span>
        <span>총 24문항</span>
      </div>
      <button class="primary-btn" onclick="startQuiz()">검사 시작하기</button>
    </div>

    <!-- 2. 실제 질문 진행 영역 -->
    <div id="quiz-content">
      <div class="progress-bar">
        <div class="progress" id="progress"></div>
      </div>
      <div class="question-title" id="q-counter">질문 1 / 24</div>
      <div class="question-text" id="q-text">질문 내용이 여기에 들어옵니다.</div>
      <div class="choices-box" id="choices-container"></div>
    </div>
  </div>

  <script>
    const archetypes = {
      INNOCENT: {
        title: "순수주의자 (The Innocent)",
        badge: "낙관과 신뢰의 무의식",
        desc: "당신은 세상을 긍정적이고 순수한 시선으로 바라보며 조화로운 삶을 꿈꿉니다. 성실하고 순진무구한 태도로 사람들에게 따뜻한 안정감을 줍니다.\n\n• 핵심 욕구: 안전, 순수한 행복, 조화\n• 대표 강점: 높은 신뢰도, 낙천성, 성실함\n• 그림자(주의점): 현실 도피, 지나친 순진함으로 인한 상처"
      },
      EVERYMAN: {
        title: "보통 사람 (The Everyman)",
        badge: "평등과 유대감의 무의식",
        desc: "당신은 위선 없이 진솔하며 모든 사람과 동등하게 어울릴 줄 아는 현실적인 사람입니다. 누군가를 차별하지 않고 끈끈한 소속감을 형성합니다.\n\n• 핵심 욕구: 소속감, 상호 연결, 공감\n• 대표 강점: 겸손함, 친화력, 뛰어난 공감대 형성\n• 그림자(주의점): 집단에 묻혀 개성을 잃거나 남의 시선을 과하게 의식함"
      },
      HERO: {
        title: "영웅 (The Hero)",
        badge: "용기와 결단의 무의식",
        desc: "당신은 도전을 회피하지 않고 강인한 의지로 역경을 뚫고 나가는 사람입니다. 목표를 성취하고 자신의 가치를 세상에 증명할 때 가장 살아있음을 느낍니다.\n\n• 핵심 욕구: 역경 극복, 역량 증명, 승리\n• 대표 강점: 끈기, 투지, 결단력, 솔선수범\n• 그림자(주의점): 끊임없이 싸울 대상을 찾거나 실패에 대한 병적인 두려움"
      },
      CAREGIVER: {
        title: "조력자 (The Caregiver)",
        badge: "보호와 연민의 무의식",
        desc: "당신은 타인의 고통을 지나치지 못하고 돕고자 하는 깊은 이타심을 지녔습니다. 주변 사람들에게 안전한 울타리가 되어주며 보살피는 데서 행복을 느낍니다.\n\n• 핵심 욕구: 타인 보호, 양육, 보살핌\n• 대표 강점: 헌신, 연민, 세심한 배려\n• 그림자(주의점): 자기희생으로 인한 탈진(번아웃), 과보호"
      },
      EXPLORER: {
        title: "탐험가 (The Explorer)",
        badge: "자유와 자아 발견의 무의식",
        desc: "당신은 규격화된 틀에 갇히는 것을 거부하며 새로운 세상과 자아를 찾아 나섭니다. 스스로 결정하고 행동할 때 진정한 자유와 활력을 만끽합니다.\n\n• 핵심 욕구: 자유, 새로운 발견, 자아실현\n• 대표 강점: 독립심, 호기심, 개방적 태도\n• 그림자(주의점): 한곳에 정착하지 못하는 방황, 책임 회피"
      },
      REBEL: {
        title: "파괴자/반역자 (The Rebel)",
        badge: "변혁과 해방의 무의식",
        desc: "당신은 불합리한 관습과 낡은 질서를 과감하게 깨뜨리고 변화를 만들어냅니다. 세상의 당연한 기준에 의문을 품고 새로운 대안을 개척합니다.\n\n• 핵심 욕구: 낡은 틀의 파괴, 변혁, 자유\n• 대표 강점: 비판적 사고, 파격적인 실행력, 당당함\n• 그림자(주의점): 무조건적인 반발심, 파괴적 충동"
      },
      LOVER: {
        title: "연인 (The Lover)",
        badge: "열정과 친밀함의 무의식",
        desc: "당신은 사람, 예술, 일 등 사랑하는 대상에 뜨거운 열정을 쏟아붓습니다. 아름다움을 음미하고 타인과 깊은 교감을 나눌 때 큰 환희를 느낍니다.\n\n• 핵심 욕구: 친밀감, 열정, 감성적 교감\n• 대표 강점: 낭만성, 매력, 풍부한 감수성\n• 그림자(주의점): 거절에 대한 극심한 두려움, 감정적 과몰입"
      },
      CREATOR: {
        title: "창조자 (The Creator)",
        badge: "상상과 구현의 무의식",
        desc: "당신은 머릿속에 번뜩이는 비전을 눈앞의 현실로 만들어내는 창의적인 장인입니다. 남들과 다른 독창적인 것을 빚어낼 때 존재 의미를 찾습니다.\n\n• 핵심 욕구: 독창적인 것의 구현, 영원한 작품 완성\n• 대표 강점: 예술적 감각, 혁신성, 상상력\n• 그림자(주의점): 지나친 완벽주의로 인한 시작 지연, 피로"
      },
      JESTER: {
        title: "어릿광대 (The Jester)",
        badge: "유희와 해방의 무의식",
        desc: "당신은 어떤 무거운 상황에서도 웃음과 재미를 찾아내 주변을 환하게 밝힙니다. 미래의 걱정보다 지금 이 순간을 즐기며 사람들의 경직된 마음을 풉니다.\n\n• 핵심 욕구: 순간의 즐거움, 유쾌함, 지루함 타파\n• 대표 강점: 위트, 분위기 반전, 유머 감각\n• 그림자(주의점): 진지해야 할 순간의 회피, 무책임"
      },
      SAGE: {
        title: "현자 (The Sage)",
        badge: "지혜와 탐구의 무의식",
        desc: "당신은 감정이나 속설에 흔들리지 않고 본질적인 진리와 원리를 탐구합니다. 방대한 지식과 객관적인 분석을 통해 세상을 명확히 꿰뚫어 봅니다.\n\n• 핵심 욕구: 진리 탐구, 지식 획득, 객관적 이해\n• 대표 강점: 통찰력, 분석력, 지적 호기심\n• 그림자(주의점): 과도한 생각으로 행동하지 못하는 분석 마비"
      },
      MAGICIAN: {
        title: "마법사 (The Magician)",
        badge: "비전과 변화의 무의식",
        desc: "당신은 숨겨진 원리와 직관을 바탕으로 판도를 바꾸는 비전가입니다. 남들이 불가능하다고 여기는 기적 같은 변화와 돌파구를 만들어냅니다.\n\n• 핵심 욕구: 근본적인 변혁, 원리의 터득, 비전 실현\n• 대표 강점: 직관력, 통찰적 리더십, 변혁 주도\n• 그림자(주의점): 조작적 태도, 현실과의 괴리"
      },
      RULER: {
        title: "통치자 (The Ruler)",
        badge: "통제와 번영의 무의식",
        desc: "당신은 혼란 속에서 확고한 규율과 질서를 수립해 번영을 일구는 지도자입니다. 책임을 기꺼이 짊어지며 안정적인 환경을 구축하는 데 탁월합니다.\n\n• 핵심 욕구: 통제권, 안정, 성공적인 시스템 구축\n• 대표 강점: 리더십, 조직 관리, 높은 책임감\n• 그림자(주의점): 권위주의, 모든 것을 통제하려는 강박"
      }
    };

    // 총 24문항 데이터 (각 원형 정확히 8회 균등 배정)
    const questions = [
      {
        question: "주말이나 휴일에 나만의 완벽한 하루를 보낸다면?",
        choices: [
          { text: "아직 가보지 않은 미지의 장소로 떠나 자유를 만끽한다.", type: "EXPLORER" },
          { text: "조용히 책이나 다큐멘터리를 파고들며 새로운 통찰을 얻는다.", type: "SAGE" },
          { text: "친구들과 파티를 열거나 맛있는 음식을 먹으며 신나게 웃는다.", type: "JESTER" },
          { text: "새로운 아이디어를 구상하고 작품이나 결과물을 직접 만든다.", type: "CREATOR" }
        ]
      },
      {
        question: "주변 사람들이 나에게 가장 자주 해주는 말은?",
        choices: [
          { text: "\"너랑 있으면 마음이 정말 편안하고 배려받는 기분이야.\"", type: "CAREGIVER" },
          { text: "\"넌 어떤 어려운 일도 기어코 해내는 끈기가 있어.\"", type: "HERO" },
          { text: "\"가식 없이 편하고 누구와도 잘 통하는 진솔한 친구야.\"", type: "EVERYMAN" },
          { text: "\"너는 사람을 끌어당기는 특별한 직관과 아우라가 있어.\"", type: "MAGICIAN" }
        ]
      },
      {
        question: "모임이나 팀 프로젝트에서 위기 상황이 터졌을 때 나는?",
        choices: [
          { text: "전면에 나서서 명확한 규칙을 정하고 질서를 바로잡는다.", type: "RULER" },
          { text: "\"기존 방식이 틀렸어!\"라며 과감하게 판을 엎고 새 길을 찾는다.", type: "REBEL" },
          { text: "누군가 다치지 않도록 팀원들의 감정을 살피고 챙긴다.", type: "CAREGIVER" },
          { text: "원인을 차분하고 객관적으로 분석해 최적의 해결책을 제시한다.", type: "SAGE" }
        ]
      },
      {
        question: "내가 인생에서 가장 중요하게 추구하는 핵심 가치는?",
        choices: [
          { text: "거짓 없는 신뢰와 순수한 행복", type: "INNOCENT" },
          { text: "진심을 다해 몰입할 수 있는 사랑과 깊은 유대", type: "LOVER" },
          { text: "남들이 보지 못하는 비전을 현실로 바꾸는 힘", type: "MAGICIAN" },
          { text: "남들에게 휘둘리지 않고 내 뜻대로 통제하는 안정감", type: "RULER" }
        ]
      },
      {

    const scores = {
      INNOCENT: 0, EVERYMAN: 0, HERO: 0, CAREGIVER: 0,
      EXPLORER: 0, REBEL: 0, LOVER: 0, CREATOR: 0,
      JESTER: 0, SAGE: 0, MAGICIAN: 0, RULER: 0
    };

    let currentIndex = 0;

    // 검사 시작 버튼 클릭 시 호출
    function startQuiz() {
      document.getElementById('intro-content').style.display = 'none';
      document.getElementById('quiz-content').style.display = 'block';
      renderQuestion();
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      document.getElementById('q-counter').innerText = `질문 ${currentIndex + 1} / ${questions.length}`;
      document.getElementById('q-text').innerText = q.question;
      
      const percent = (currentIndex / questions.length) * 100;
      document.getElementById('progress').style.width = `${percent}%`;

      const choicesBox = document.getElementById('choices-container');
      choicesBox.innerHTML = '';

      q.choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerText = choice.text;
        btn.onclick = () => selectChoice(choice.type);
        choicesBox.appendChild(btn);
      });
    }

    function selectChoice(type) {
      scores[type] += 1;
      currentIndex++;

      if (currentIndex < questions.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      let highestType = 'HERO';
      let maxScore = -1;
      for (const type in scores) {
        if (scores[type] > maxScore) {
          maxScore = scores[type];
          highestType = type;
        }
      }

      const result = archetypes[highestType];
      const container = document.getElementById('quiz-container');
      
      container.innerHTML = `
        <div class="result-box">
          <div class="result-badge">${result.badge}</div>
          <h2 class="result-title">${result.title}</h2>
          <div class="result-desc">${result.desc}</div>
          <button class="primary-btn" onclick="location.reload()">테스트 다시 하기</button>
        </div>
      `;
    }
  </script>
