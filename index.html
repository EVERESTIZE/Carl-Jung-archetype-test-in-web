<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>칼 융 12대 성격 원형 검사</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      min-height: 100vh;
      min-height: 100dvh; /* 모바일용 */
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 16px;
    }
    .card {
      background: #131c2e;
      border: 1px solid #1e293b;
      padding: 36px 26px;
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    }

    /* 시작 화면 스타일 */
    .intro-box {
      text-align: center;
      animation: fadeIn 0.4s ease;
    }
    .intro-badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .intro-title {
      font-size: 1.75rem;
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 18px;
      color: #f8fafc;
    }
    .intro-desc {
      font-size: 0.96rem;
      line-height: 1.75;
      color: #cbd5e1;
      margin-bottom: 28px;
      text-align: left;
      background: #090d16;
      border: 1px solid #1e293b;
      padding: 20px;
      border-radius: 12px;
    }
    .intro-meta {
      display: flex;
      justify-content: center;
      gap: 16px;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .intro-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 퀴즈 영역 스타일 (기본적으로 숨김 처리) */
    #quiz-content {
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .progress-bar {
      height: 6px;
      background: #1e293b;
      border-radius: 3px;
      margin-bottom: 24px;
      overflow: hidden;
    }
    .progress {
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      width: 0%;
      transition: width 0.3s ease;
    }
    .question-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #38bdf8;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .question-text {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 24px;
      min-height: 60px;
      white-space: pre-line;
    }
    .choices-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .choice-btn {
      width: 100%;
      text-align: left;
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      padding: 15px 18px;
      border-radius: 12px;
      font-size: 0.98rem;
      line-height: 1.4;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .choice-btn:hover {
      background: #27354f;
      border-color: #38bdf8;
      transform: translateY(-2px);
      color: #ffffff;
    }

    /* 결과 화면 스타일 */
    .result-box {
      text-align: center;
      animation: fadeIn 0.4s ease;
    }
    .result-badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .result-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 16px;
      color: #f8fafc;
    }
    .result-desc {
      font-size: 0.95rem;
      line-height: 1.7;
      color: #cbd5e1;
      margin-bottom: 24px;
      white-space: pre-line;
      background: #090d16;
      border: 1px solid #1e293b;
      padding: 20px;
      border-radius: 12px;
      text-align: left;
    }

    /* 시작 버튼 */
    .primary-btn {
      width: auto;
      min-width: 50%;
      margin: 0 auto;
      display: block;
      
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      color: #ffffff;
      border: none;
      font-weight: 700;
      padding: 15px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1.05rem;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
      transition: all 0.2s ease;
    }
    .primary-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card" id="quiz-container">
    <!-- 1. 첫 시작 안내 화면 -->
    <div class="intro-box" id="intro-content">
      <div class="intro-badge">Jungian Archetypes Test</div>
      <h1 class="intro-title">무의식에 지배되는 나,<br>칼 융의 12대 성격 원형 검사</h1>
      <div class="intro-desc">
        스위스의 심리학자 <strong>칼 구스타프 융(Carl Jung)</strong>은 인류에게 공유되는 무의식의 원초적 이미지와 행동 패턴을 <strong>'원형(Archetype)'</strong>이라 불렀습니다.<br><br>
        본 검사는 12가지 대표 원형 중 나의 사고와 선택을 이끄는 <strong>핵심 동기, 고유한 강점</strong>과 당신이 경계해야 할 <strong>무의식 속 그림자</strong>를 진단합니다.
      </div>
      <div class="intro-meta">
        <span>⏱ 소요 시간 약 3분</span>
        <span>•</span>
        <span>총 12문항</span>
      </div>
      <button class="primary-btn" onclick="startQuiz()">검사 시작하기</button>
    </div>

    <!-- 2. 실제 질문 진행 영역 -->
    <div id="quiz-content">
      <div class="progress-bar">
        <div class="progress" id="progress"></div>
      </div>
      <div class="question-title" id="q-counter">질문 1 / 12</div>
      <div class="question-text" id="q-text">질문 내용이 여기에 들어옵니다.</div>
      <div class="choices-box" id="choices-container"></div>
    </div>
  </div>

  <script>
    const archetypes = {

          { text: "어떠한 재미나 웃음도 허용되지 않는 경직된 분위기", type: "JESTER" },
          { text: "나의 성과와 존재 가치를 알아주지 않는 무기력한 상황", type: "HERO" }
        ]
      },
      {
        question: "선택의 기로에 섰을 때 나의 가장 주된 결정 기준은?",
        choices: [
          { text: "\"내 마음을 뛰게 하는가? 가슴 깊이 사랑할 수 있는가?\"", type: "LOVER" },
          { text: "\"세상에 없던 나만의 독창적인 결과물을 남길 수 있는가?\"", type: "CREATOR" },
          { text: "\"누구도 소외되지 않고 모두에게 보편적으로 공평한가?\"", type: "EVERYMAN" },
          { text: "\"옳고 그름이 명확하며 선한 믿음에 부합하는가?\"", type: "INNOCENT" }
        ]
      },
      {
        question: "내가 꿈꾸는 이상적인 리더십의 형태는?",
        choices: [
          { text: "강력한 권한과 조직화로 구성원 전체를 번영으로 이끄는 리더", type: "RULER" },
          { text: "앞장서서 장애물을 부수고 목표를 돌파해 내는 솔선수범형 리더", type: "HERO" },
          { text: "보이지 않는 큰 그림을 보고 사람들에게 영감을 불어넣는 비전가", type: "MAGICIAN" },
          { text: "구성원들의 필요를 조용히 채워주는 든든한 서포터형 리더", type: "CAREGIVER" }
        ]
      },
      {
        question: "지친 하루를 끝내고 나를 가장 깊게 치유해 주는 것은?",
        choices: [
          { text: "아무 생각 없이 한바탕 크게 웃을 수 있는 예능이나 대화", type: "JESTER" },
          { text: "복잡한 세상을 잊게 해주는 깊이 있는 사색과 독서", type: "SAGE" },
          { text: "좋아하는 음악을 듣거나 내 손으로 무언가를 끄적이는 창작의 시간", type: "CREATOR" },
          { text: "내가 사랑하는 대상과 나누는 온기 있는 대화와 시간", type: "LOVER" }
        ]
      },
      {
        question: "새로운 무리에 들어갔을 때 나의 자연스러운 포지션은?",
        choices: [
          { text: "튀지 않고 모나지 않게 사람들과 두루두루 어울리는 이웃", type: "EVERYMAN" },
          { text: "기존의 이상한 서열이나 관행을 슬쩍 무시하고 마이웨이로 행동하는 사람", type: "REBEL" },
          { text: "남들이 안 해본 색다른 경험담을 풀어놓는 모험가", type: "EXPLORER" },
          { text: "사람들의 선의를 믿으며 편견 없이 먼저 미소 짓는 사람", type: "INNOCENT" }
        ]
      },
      {
        question: "무언가를 창작하거나 일할 때 가장 집착하는 부분은?",
        choices: [
          { text: "어설픈 흉내가 아닌, 나만의 독창적인 철학과 완성도", type: "CREATOR" },
          { text: "어떤 변수도 통제할 수 있는 정교한 구조와 질서", type: "RULER" },
          { text: "감정이나 편향이 섞이지 않은 팩트와 논리적 무결성", type: "SAGE" },
          { text: "보는 사람의 마음을 뒤흔드는 강렬한 감동과 열정", type: "LOVER" }
        ]
      },
      {
        question: "친구가 불합리한 일을 당해 분통을 터뜨릴 때 나의 첫 반응은?",
        choices: [
          { text: "\"가만있지 마! 당장 판을 엎고 권리를 찾아야 해!\"", type: "REBEL" },
          { text: "\"속상했지? 네 잘못이 아니야.\" 등을 토닥여 준다.", type: "CAREGIVER" },
          { text: "\"걱정하지 마. 내가 어떻게든 이길 방법을 마련해 줄게.\"", type: "HERO" },
          { text: "일단 빵 터지는 농담으로 분위기를 풀고 기분을 환기해 준다.", type: "JESTER" }
        ]
      },
      {
        question: "나라는 사람을 한 문장으로 정의한다면?",
        choices: [
          { text: "어떠한 틀에도 얽매이지 않고 길을 개척하는 자유인", type: "EXPLORER" },
          { text: "세상의 숨은 비밀과 잠재력을 열어젖히는 연금술사", type: "MAGICIAN" },
          { text: "누구에게나 편안한 쉼터가 되어주는 친근한 이웃", type: "EVERYMAN" },
          { text: "세상의 어둠 속에서도 맑은 희망과 선함을 믿는 사람", type: "INNOCENT" }
        ]
      }
    ];

    const scores = {
      INNOCENT: 0, EVERYMAN: 0, HERO: 0, CAREGIVER: 0,
      EXPLORER: 0, REBEL: 0, LOVER: 0, CREATOR: 0,
      JESTER: 0, SAGE: 0, MAGICIAN: 0, RULER: 0
    };

    let currentIndex = 0;

    // 검사 시작 버튼 클릭 시 호출
    function startQuiz() {
      document.getElementById('intro-content').style.display = 'none';
      document.getElementById('quiz-content').style.display = 'block';
      renderQuestion();
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      document.getElementById('q-counter').innerText = `질문 ${currentIndex + 1} / ${questions.length}`;
      document.getElementById('q-text').innerText = q.question;
      
      const percent = (currentIndex / questions.length) * 100;
      document.getElementById('progress').style.width = `${percent}%`;

      const choicesBox = document.getElementById('choices-container');
      choicesBox.innerHTML = '';

      q.choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerText = choice.text;
        btn.onclick = () => selectChoice(choice.type);
        choicesBox.appendChild(btn);
      });
    }

    function selectChoice(type) {
      scores[type] += 1;
      currentIndex++;

      if (currentIndex < questions.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      let highestType = 'HERO';
      let maxScore = -1;
      for (const type in scores) {
        if (scores[type] > maxScore) {
          maxScore = scores[type];
          highestType = type;
        }
      }

      const result = archetypes[highestType];
      const container = document.getElementById('quiz-container');
      
      container.innerHTML = `
        <div class="result-box">
          <div class="result-badge">${result.badge}</div>
          <h2 class="result-title">${result.title}</h2>
          <div class="result-desc">${result.desc}</div>
          <button class="primary-btn" onclick="location.reload()">테스트 다시 하기</button>
        </div>
      `;
    }
  </script>
</body>
</html>
